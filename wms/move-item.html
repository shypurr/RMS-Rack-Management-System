<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Move Item — VastraWMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="wms-shell" id="wmsShell">
  <div class="main-content" id="mainContent">
    <main class="page-content">
      <div class="breadcrumb-bar"><a href="index.html">Dashboard</a> / <span>Move Item</span></div>
      <div class="page-header">
        <div>
          <h1 class="page-title">Move Items</h1>
          <p class="page-subtitle">Relocate stock between racks and locations</p>
        </div>
      </div>

      <div class="grid gap-col-6" style="grid-template-columns:1fr 380px">
        <!-- Left: Workflow -->
        <div>
          <!-- Search Item -->
          <div class="card mb-4">
            <div class="card-header">
              <span class="card-title"><i class="fa-solid fa-magnifying-glass" style="color:var(--primary)"></i>&nbsp; Search Item</span>
            </div>
            <div class="card-body">
              <div class="input-group mb-3">
                <span class="input-icon"><i class="fa-solid fa-search"></i></span>
                <input class="form-control" id="moveSearch" placeholder="Search by name, SKU, barcode…">
              </div>
              <div id="moveSearchResults" style="max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-md);display:none"></div>
            </div>
          </div>

          <!-- Current Location -->
          <div class="card mb-4" id="currentLocCard" style="display:none">
            <div class="card-header">
              <span class="card-title"><i class="fa-solid fa-location-dot" style="color:var(--primary)"></i>&nbsp; Current Location</span>
            </div>
            <div class="card-body" id="currentLocBody"></div>
          </div>

          <!-- Select New Rack -->
          <div class="card mb-4" id="newRackCard" style="display:none">
            <div class="card-header">
              <span class="card-title"><i class="fa-solid fa-layer-group" style="color:var(--primary)"></i>&nbsp; Select New Rack</span>
            </div>
            <div class="card-body">
              <div class="grid cols-2 gap-col-4 mb-4">
                <div class="form-group">
                  <label class="form-label">Quantity to Move</label>
                  <input class="form-control" type="number" id="moveQty" min="1" value="1">
                </div>
                <div class="form-group">
                  <label class="form-label">Reason</label>
                  <select class="form-control" id="moveReason">
                    <option>Restock</option><option>Transfer</option><option>Quality Check</option>
                    <option>Return</option><option>Adjustment</option>
                  </select>
                </div>
              </div>
              <p class="text-muted text-sm mb-3">Available racks with capacity:</p>
              <div id="availableRacks" class="grid cols-2 gap-col-4"></div>
            </div>
          </div>

          <!-- Confirm Move -->
          <div class="card" id="confirmCard" style="display:none">
            <div class="card-header"><span class="card-title"><i class="fa-solid fa-check" style="color:var(--success)"></i>&nbsp; Confirm Move</span></div>
            <div class="card-body" id="confirmBody"></div>
          </div>
        </div>

        <!-- Right: Movement History -->
        <div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">Movement History</span>
              <span class="badge badge-primary" id="movHistBadge">0</span>
            </div>
            <div style="max-height:600px;overflow-y:auto" id="movementHistory">
              <div class="empty-state" style="padding:32px">
                <i class="fa-solid fa-arrows-up-down"></i>
                <p>No movements yet</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
const MoveItem = (() => {
  let selectedItem = null;
  let selectedNewRack = null;
  let sessionMovements = [];

  function init() {
    document.getElementById('moveSearch').addEventListener('input', debounce(search, 200));
    // Check URL param
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (id && window.WMS_DATA) {
      const item = WMS_DATA.items.find(i => i.id === id);
      if (item) selectItem(item);
    }
    renderHistory();
  }

  function debounce(fn, delay) {
    let t; return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), delay); };
  }

  function search() {
    const q = document.getElementById('moveSearch').value.trim().toLowerCase();
    const results = document.getElementById('moveSearchResults');
    if (q.length < 2) { results.style.display='none'; return; }

    const found = WMS_DATA.items.filter(i =>
      i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q) || i.barcode.includes(q)
    ).slice(0,10);

    results.innerHTML = found.length ? found.map(i => `
      <div class="search-result-item" onclick="MoveItem.selectItem(WMS_DATA.items.find(x=>x.id==='${i.id}'))">
        <img src="${i.image}" class="search-result-icon" alt="">
        <div>
          <div class="font-600">${i.name}</div>
          <div class="search-sku">${i.sku} · Rack: ${i.rack} · Stock: ${i.qty}</div>
        </div>
        <span class="badge ${App.statusBadge(i.status)}">${i.status}</span>
      </div>`).join('') :
      '<div class="search-result-item text-muted">No items found</div>';

    results.style.display = 'block';
  }

  function selectItem(item) {
    if (!item) return;
    selectedItem = item;
    selectedNewRack = null;

    document.getElementById('moveSearchResults').style.display = 'none';
    document.getElementById('moveSearch').value = item.name;
    document.getElementById('moveQty').max = item.qty;
    document.getElementById('moveQty').value = Math.min(1, item.qty);

    // Show current location
    const card = document.getElementById('currentLocCard');
    card.style.display = 'block';
    document.getElementById('currentLocBody').innerHTML = `
      <div class="flex items-center gap-4 mb-4">
        <img src="${item.image}" style="width:60px;height:60px;border-radius:var(--radius-md);object-fit:cover" alt="">
        <div>
          <div class="font-700">${item.name}</div>
          <div class="text-sm text-muted">${item.sku} · ${item.category}</div>
          <span class="badge ${App.statusBadge(item.status)} mt-1">${item.status}</span>
        </div>
        <div class="ml-auto" style="text-align:right">
          <div class="font-700" style="font-size:22px;color:var(--primary)">${item.qty}</div>
          <div class="text-xs text-muted">Total Stock</div>
        </div>
      </div>
      <div class="grid cols-4 gap-col-4" style="background:var(--bg);padding:12px;border-radius:var(--radius-md)">
        <div><div class="text-xs text-muted">Warehouse</div><div class="font-600">${item.warehouseName}</div></div>
        <div><div class="text-xs text-muted">Zone</div><div class="font-600">${item.zone}</div></div>
        <div><div class="text-xs text-muted">Rack</div><div class="font-600 text-primary-color">${item.rack}</div></div>
        <div><div class="text-xs text-muted">Shelf / Bin</div><div class="font-600">${item.shelf} / ${item.bin}</div></div>
      </div>`;

    // Show available racks
    document.getElementById('newRackCard').style.display = 'block';
    const racks = WMS_DATA.racks.filter(r => r.name !== item.rack && r.available > 0).sort((a,b)=>b.available-a.available).slice(0,6);
    document.getElementById('availableRacks').innerHTML = racks.map(r => `
      <div class="rack-card ${r.status}" onclick="MoveItem.selectRack('${r.id}')" style="width:100%;cursor:pointer">
        <div class="rack-status-dot"></div>
        <div class="font-700 mb-1">${r.name}</div>
        <div class="text-xs text-muted mb-2">Zone ${r.zone} · ${r.available} free slots</div>
        <div class="progress"><div class="progress-bar ${App.pctColor(r.pct)}" style="width:${r.pct}%"></div></div>
      </div>`).join('');

    card.scrollIntoView({ behavior: 'smooth' });
  }

  function selectRack(id) {
    selectedNewRack = WMS_DATA.racks.find(r => r.id === id);
    if (!selectedNewRack) return;

    const qty    = parseInt(document.getElementById('moveQty').value) || 1;
    const reason = document.getElementById('moveReason').value;
    const card   = document.getElementById('confirmCard');
    card.style.display = 'block';
    document.getElementById('confirmBody').innerHTML = `
      <div class="flex items-center gap-4 mb-6" style="background:var(--bg);padding:16px;border-radius:var(--radius-md)">
        <div style="text-align:center;flex:1;border-right:1px solid var(--border)">
          <div class="text-xs text-muted mb-1">From</div>
          <div class="font-700 text-primary-color" style="font-size:18px">${selectedItem.rack}</div>
          <div class="text-xs text-muted">${selectedItem.zone} · ${selectedItem.aisle}</div>
        </div>
        <div style="color:var(--primary);font-size:24px"><i class="fa-solid fa-arrow-right-long"></i></div>
        <div style="text-align:center;flex:1;border-left:1px solid var(--border)">
          <div class="text-xs text-muted mb-1">To</div>
          <div class="font-700 text-primary-color" style="font-size:18px">${selectedNewRack.name}</div>
          <div class="text-xs text-muted">Zone ${selectedNewRack.zone}</div>
        </div>
      </div>
      <div class="grid cols-3 gap-col-4 mb-4">
        <div><div class="text-xs text-muted">Item</div><div class="font-600 truncate">${selectedItem.name}</div></div>
        <div><div class="text-xs text-muted">Quantity</div><div class="font-600">${qty} units</div></div>
        <div><div class="text-xs text-muted">Reason</div><div class="font-600">${reason}</div></div>
      </div>
      <div class="flex gap-3">
        <button class="btn btn-ghost" onclick="document.getElementById('confirmCard').style.display='none'">Cancel</button>
        <button class="btn btn-primary" onclick="MoveItem.confirmMove(${qty})"><i class="fa-solid fa-check"></i> Confirm Move</button>
      </div>`;
    card.scrollIntoView({ behavior: 'smooth' });
  }

  function confirmMove(qty) {
    if (!selectedItem || !selectedNewRack) return;
    const reason = document.getElementById('moveReason').value;
    const mov = {
      id: `MOV-SESSION-${Date.now()}`,
      itemName: selectedItem.name,
      fromRack: selectedItem.rack,
      toRack:   selectedNewRack.name,
      qty,
      reason,
      movedBy: 'Raj Kumar',
      date: new Date().toLocaleDateString(),
      status: 'Completed',
    };

    // Update item location
    const oldRack = WMS_DATA.racks.find(r => r.name === selectedItem.rack);
    if (oldRack) {
      oldRack.occupied  = Math.max(0, oldRack.occupied - qty);
      oldRack.available = oldRack.capacity - oldRack.occupied;
      oldRack.pct       = Math.round((oldRack.occupied/oldRack.capacity)*100);
    }
    selectedNewRack.occupied  = Math.min(selectedNewRack.capacity, selectedNewRack.occupied + qty);
    selectedNewRack.available = selectedNewRack.capacity - selectedNewRack.occupied;
    selectedNewRack.pct       = Math.round((selectedNewRack.occupied/selectedNewRack.capacity)*100);

    selectedItem.rack  = selectedNewRack.name;
    selectedItem.rackId= selectedNewRack.id;
    selectedItem.zone  = selectedNewRack.zone;
    selectedItem.aisle = selectedNewRack.aisle;
    selectedItem.shelf = selectedNewRack.shelf;
    selectedItem.bin   = selectedNewRack.bin;

    WMS_DATA.movements.push(mov);
    sessionMovements.unshift(mov);
    renderHistory();
    App.toast(`Moved ${qty} units to ${selectedNewRack.name}`, 'success');

    // Reset
    selectedItem = selectedNewRack = null;
    ['currentLocCard','newRackCard','confirmCard'].forEach(id => document.getElementById(id).style.display = 'none');
    document.getElementById('moveSearch').value = '';
  }

  function renderHistory() {
    const all = [...sessionMovements, ...WMS_DATA.movements.slice(-10).reverse()];
    const list = document.getElementById('movementHistory');
    document.getElementById('movHistBadge').textContent = all.length;
    list.innerHTML = all.slice(0,15).map(m => `
      <div class="notif-item">
        <div class="notif-icon-wrap ${m.status==='Completed'?'success':'warning'}">
          <i class="fa-solid fa-${m.status==='Completed'?'check':'clock'}"></i>
        </div>
        <div class="notif-content">
          <div class="notif-item-title">${m.itemName}</div>
          <div class="notif-item-msg">${m.fromRack} → ${m.toRack} · ${m.qty} units</div>
          <div class="notif-time">${m.reason} · ${m.movedBy} · ${m.date}</div>
        </div>
        <span class="badge ${m.status==='Completed'?'badge-success':'badge-warning'} text-xs">${m.status}</span>
      </div>`).join('');
  }

  document.addEventListener('DOMContentLoaded', init);
  return { selectItem, selectRack, confirmMove };
})();
</script>
</body>
</html>
