<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Item Details — VastraWMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="wms-shell" id="wmsShell">
  <div class="main-content" id="mainContent">
    <main class="page-content" id="itemDetailContent">
      <div class="empty-state" style="padding:80px">
        <i class="fa-solid fa-box-open"></i>
        <h3>Loading item…</h3>
      </div>
    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const id     = params.get('id');
  const content = document.getElementById('itemDetailContent');
  if (!id || !window.WMS_DATA) { content.innerHTML = '<div class="empty-state" style="padding:80px"><i class="fa-solid fa-circle-xmark"></i><h3>Item not found</h3></div>'; return; }

  const item = WMS_DATA.items.find(i => i.id === id);
  if (!item) { content.innerHTML = '<div class="empty-state" style="padding:80px"><i class="fa-solid fa-circle-xmark"></i><h3>Item not found</h3><p>ID: '+id+'</p></div>'; return; }

  const movements = WMS_DATA.movements.filter(m => m.itemId === item.id).slice(-5);
  const receivings = WMS_DATA.receivings.filter(r => r.itemId === item.id).slice(-5);

  content.innerHTML = `
    <div class="breadcrumb-bar"><a href="index.html">Dashboard</a> / <a href="inventory.html">Inventory</a> / <span>${item.sku}</span></div>
    <div class="page-header">
      <div><h1 class="page-title">${item.name}</h1><p class="page-subtitle">${item.sku} · ${item.category}</p></div>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
        <button class="btn btn-ghost btn-sm" onclick="App.toast('QR code generated','info')"><i class="fa-solid fa-qrcode"></i> QR Code</button>
        <a href="move-item.html?id=${item.id}" class="btn btn-outline"><i class="fa-solid fa-arrows-up-down"></i> Move</a>
        <button class="btn btn-primary" onclick="App.openModal('editDetailModal')"><i class="fa-solid fa-pen"></i> Edit</button>
      </div>
    </div>

    <div class="grid gap-col-6" style="grid-template-columns:300px 1fr">
      <!-- Left: Image + summary -->
      <div>
        <div class="card mb-4" style="text-align:center;padding:24px">
          <img src="${item.image}" style="width:120px;height:120px;border-radius:var(--radius-md);margin:0 auto 16px;display:block;background:var(--bg);object-fit:cover" alt="">
          <div class="font-700" style="font-size:16px;margin-bottom:4px">${item.name}</div>
          <span class="badge ${App.statusBadge(item.status)} mb-3">${item.status}</span>
          <div class="text-sm text-muted mb-1">Barcode: <strong>${item.barcode}</strong></div>
          <div class="text-sm text-muted">SKU: <strong>${item.sku}</strong></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Stock Levels</span></div>
          <div class="card-body">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span class="text-sm text-muted">Total Stock</span>
              <span class="font-700 text-primary-color" style="font-size:18px">${App.fmt(item.qty)}</span>
            </div>
            <div class="progress mb-3" style="height:8px">
              <div class="progress-bar" style="width:${Math.min(100,Math.round(item.available/item.qty*100))}%"></div>
            </div>
            <div class="grid cols-2 gap-col-4">
              <div style="text-align:center;padding:10px;background:var(--bg);border-radius:var(--radius-sm)">
                <div class="font-700 text-primary-color">${item.available}</div>
                <div class="text-xs text-muted">Available</div>
              </div>
              <div style="text-align:center;padding:10px;background:var(--bg);border-radius:var(--radius-sm)">
                <div class="font-700" style="color:var(--warning)">${item.reserved}</div>
                <div class="text-xs text-muted">Reserved</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Details + tabs -->
      <div>
        <div class="card mb-4">
          <div class="card-header"><span class="card-title">Item Details</span></div>
          <div class="card-body">
            <div class="grid cols-3 gap-col-4">
              <div><div class="text-xs text-muted">Category</div><div class="font-600">${item.category}</div></div>
              <div><div class="text-xs text-muted">Brand</div><div class="font-600">${item.brand}</div></div>
              <div><div class="text-xs text-muted">Color</div><div class="font-600">${item.color}</div></div>
              <div><div class="text-xs text-muted">Size</div><div class="font-600">${item.size}</div></div>
              <div><div class="text-xs text-muted">Unit</div><div class="font-600">${item.unit}</div></div>
              <div><div class="text-xs text-muted">Added Date</div><div class="font-600">${item.addedDate}</div></div>
              <div><div class="text-xs text-muted">Purchase Price</div><div class="font-600">${App.currency(item.purchasePrice)}</div></div>
              <div><div class="text-xs text-muted">Selling Price</div><div class="font-600">${App.currency(item.sellingPrice)}</div></div>
              <div><div class="text-xs text-muted">Supplier</div><div class="font-600">${item.supplierName}</div></div>
            </div>
            <hr class="divider">
            <div class="grid cols-4 gap-col-4">
              <div><div class="text-xs text-muted">Warehouse</div><div class="font-600">${item.warehouseName}</div></div>
              <div><div class="text-xs text-muted">Zone</div><div class="font-600">${item.zone}</div></div>
              <div><div class="text-xs text-muted">Rack</div><div class="font-600 text-primary-color">${item.rack}</div></div>
              <div><div class="text-xs text-muted">Shelf / Bin</div><div class="font-600">${item.shelf} / ${item.bin}</div></div>
            </div>
            <hr class="divider">
            <div class="text-sm text-muted">${item.description || 'No description available.'}</div>
          </div>
        </div>

        <!-- Tabs: movements / receivings -->
        <div class="card">
          <div class="tab-bar" id="itemTabBar">
            <div class="tab-btn active" data-tab="movements" data-tab-group="itemTabs">Movement History</div>
            <div class="tab-btn" data-tab="receivings" data-tab-group="itemTabs">Purchase History</div>
          </div>
          <div class="tab-panel active" data-tab="movements" data-tab-group="itemTabs">
            ${movements.length ? `
            <div class="data-table-wrap">
              <table class="data-table">
                <thead><tr><th>From</th><th>To</th><th>Qty</th><th>Reason</th><th>By</th><th>Date</th><th>Status</th></tr></thead>
                <tbody>${movements.map(m=>`
                  <tr>
                    <td>${m.fromRack}</td><td>${m.toRack}</td>
                    <td><span class="badge badge-primary">${m.qty}</span></td>
                    <td>${m.reason}</td><td>${m.movedBy}</td><td>${m.date}</td>
                    <td><span class="badge ${App.statusBadge(m.status)}">${m.status}</span></td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : '<div class="empty-state" style="padding:32px"><i class="fa-solid fa-arrows-up-down"></i><p>No movement history</p></div>'}
          </div>
          <div class="tab-panel" data-tab="receivings" data-tab-group="itemTabs">
            ${receivings.length ? `
            <div class="data-table-wrap">
              <table class="data-table">
                <thead><tr><th>RCV ID</th><th>Qty</th><th>Supplier</th><th>Price</th><th>By</th><th>Date</th></tr></thead>
                <tbody>${receivings.map(r=>`
                  <tr>
                    <td class="text-primary-color font-600">${r.id}</td>
                    <td><span class="badge badge-success">${r.qty}</span></td>
                    <td>${r.supplier}</td>
                    <td>${App.currency(r.purchasePrice)}</td>
                    <td>${r.receivedBy}</td><td>${r.date}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : '<div class="empty-state" style="padding:32px"><i class="fa-solid fa-truck-ramp-box"></i><p>No purchase history</p></div>'}
          </div>
        </div>
      </div>
    </div>`;

  App.initTabs?.() || document.querySelectorAll('.tab-bar').forEach(bar => {
    bar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        bar.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-panel[data-tab-group="itemTabs"]')
          .forEach(p=>p.classList.toggle('active', p.dataset.tab===btn.dataset.tab));
      });
    });
  });
});
</script>
</body>
</html>
