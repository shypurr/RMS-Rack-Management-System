<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rack Management — VastraWMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="wms-shell" id="wmsShell">
  <div class="main-content" id="mainContent">
    <main class="page-content">
      <div class="breadcrumb-bar"><a href="index.html">Dashboard</a> / <span>Rack Management</span></div>
      <div class="page-header">
        <div>
          <h1 class="page-title">Rack Management</h1>
          <p class="page-subtitle">Visual warehouse layout with real-time occupancy</p>
        </div>
        <div class="flex gap-2">
          <a href="#finderSection" class="btn btn-outline"><i class="fa-solid fa-search-location"></i> Rack Finder</a>
        </div>
      </div>

      <!-- Legend + Stats -->
      <div class="card mb-4">
        <div class="card-body" style="padding:14px 20px">
          <div class="flex gap-6 flex-wrap items-center">
            <div class="flex items-center gap-2"><div style="width:12px;height:12px;border-radius:50%;background:var(--text-muted)"></div><span class="text-sm">Vacant</span></div>
            <div class="flex items-center gap-2"><div style="width:12px;height:12px;border-radius:50%;background:var(--success)"></div><span class="text-sm">Low (1–49%)</span></div>
            <div class="flex items-center gap-2"><div style="width:12px;height:12px;border-radius:50%;background:var(--warning)"></div><span class="text-sm">Partial (50–84%)</span></div>
            <div class="flex items-center gap-2"><div style="width:12px;height:12px;border-radius:50%;background:var(--danger)"></div><span class="text-sm">Full (≥85%)</span></div>
            <div class="ml-auto flex gap-4" style="font-size:13px">
              <span><strong id="rackVacantCount">—</strong> Vacant</span>
              <span><strong id="rackPartialCount">—</strong> Partial</span>
              <span><strong id="rackFullCount">—</strong> Full</span>
              <span><strong id="rackTotalCount">—</strong> Total</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Zone Visual -->
      <div class="card mb-6">
        <div class="card-header"><span class="card-title"><i class="fa-solid fa-warehouse" style="color:var(--primary)"></i>&nbsp; Warehouse Layout</span></div>
        <div class="card-body">
          <div id="zoneContainer">
            <div class="skeleton" style="height:200px"></div>
          </div>
        </div>
      </div>

      <!-- Rack Finder -->
      <div id="finderSection" class="card">
        <div class="card-header">
          <span class="card-title"><i class="fa-solid fa-search-location" style="color:var(--primary)"></i>&nbsp; Rack Finder — Vacant Only</span>
        </div>
        <div class="card-body">
          <div class="flex gap-3 flex-wrap mb-4">
            <div class="input-group" style="flex:1;min-width:180px">
              <span class="input-icon"><i class="fa-solid fa-search"></i></span>
              <input class="form-control" id="finderSearch" placeholder="Search rack name…">
            </div>
            <select class="form-control" id="finderZone" style="width:auto">
              <option value="">All Zones</option>
            </select>
            <select class="form-control" id="finderType" style="width:auto">
              <option value="">All Types</option>
              <option>Standard</option><option>Heavy Duty</option><option>Cold Storage</option><option>Pallet</option>
            </select>
            <select class="form-control" id="finderSort" style="width:auto">
              <option value="available">Most Available</option>
              <option value="pct">Least Occupied %</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
          <div class="grid cols-4 gap-col-4" id="finderGrid">
            <div class="skeleton" style="height:100px"></div>
            <div class="skeleton" style="height:100px"></div>
            <div class="skeleton" style="height:100px"></div>
            <div class="skeleton" style="height:100px"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Rack Detail Modal -->
<div class="modal-backdrop" id="rackDetailModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-header">
      <h2 class="modal-title">Rack Details</h2>
      <div class="modal-close" data-modal-close><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="modal-body" id="rackDetailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-modal-close>Close</button>
      <a href="move-item.html" class="btn btn-primary"><i class="fa-solid fa-arrows-up-down"></i> Move Items</a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script src="js/rack.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!window.WMS_DATA) return;
  const D = WMS_DATA;
  document.getElementById('rackVacantCount').textContent  = D.vacantRacks;
  document.getElementById('rackPartialCount').textContent = D.partialRacks;
  document.getElementById('rackFullCount').textContent    = D.occupiedRacks;
  document.getElementById('rackTotalCount').textContent   = D.racks.length;
});
</script>
</body>
</html>
